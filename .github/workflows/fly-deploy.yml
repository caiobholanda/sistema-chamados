name: Fly Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    if: github.repository_owner == 'Hotel-Gran-Marquise'
    concurrency:
      group: deploy-${{ github.workflow }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@1.5
      - run: flyctl deploy --local-only --no-cache
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Notificar Hub de deploy
        if: success()
        env:
          HUB_WEBHOOK_SECRET: ${{ secrets.HUB_WEBHOOK_SECRET }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          FIRST=$(printf '%s' "$COMMIT_MSG" | head -1)
          if printf '%s' "$FIRST" | grep -qiE '^hotfix'; then TIPO=hotfix
          elif printf '%s' "$FIRST" | grep -qiE '^fix'; then TIPO=fix
          elif printf '%s' "$FIRST" | grep -qiE '^feat'; then TIPO=feat
          else TIPO=melhoria; fi
          TITULO=$(printf '%s' "$FIRST" | sed 's/^[a-zA-Z-]*([^)]*): *//' | sed 's/^[a-zA-Z-]*: *//' | cut -c1-120)
          curl -sf -X POST https://hub-granmarquise.fly.dev/api/webhook/update \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $HUB_WEBHOOK_SECRET" \
            -d "$(jq -cn --arg tipo "$TIPO" --arg titulo "$TITULO" \
              '{sistemaId:"chamados",sistemaNome:"Helpdesk",tipo:$tipo,titulo:$titulo}')" || true
